# Depth-noise model for the simulated camera (read by scripts/sim_camera_adapter.py).
# The defaults are plausible placeholders, NOT measured L515 values. Tune them against the real camera:
# scripts/depth_noise_report.py prints comparable numbers for the sim and for the real camera.
sim_camera_adapter:
  ros__parameters:
    noise_enabled: true        # the launch argument depth_noise:=false overrides this
    seed: 42                   # -1 = different noise on every run
    sigma_base: 0.001          # m.  Gaussian sigma = sigma_base + sigma_slope * depth
    sigma_slope: 0.004         # m per m
    dropout_prob: 0.002        # probability that any single pixel returns nothing
    grazing_start_deg: 75.0    # surfaces seen at a steeper angle than this start to drop out ...
    grazing_end_deg: 88.0      # ... and always drop out at this angle
    edge_jump: 0.02            # m: neighbouring pixels that differ by more than this form a depth edge
    edge_dropout_prob: 0.5     # probability that an edge pixel is dropped
    flying_pixel_prob: 0.3     # probability that an edge pixel becomes a flying pixel (edge + flying must be <= 1)
